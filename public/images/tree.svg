<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5C4033;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6B4423;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5C4033;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leavesGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leavesGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leavesGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#43A047;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="350" y="550" width="100" height="450" fill="url(#trunkGradient)" rx="10"/>
  
  <!-- Tree roots -->
  <ellipse cx="320" cy="1000" rx="80" ry="30" fill="#5C4033" opacity="0.7"/>
  <ellipse cx="480" cy="1000" rx="80" ry="30" fill="#5C4033" opacity="0.7"/>
  
  <!-- Bottom layer of leaves -->
  <ellipse cx="400" cy="550" rx="280" ry="200" fill="url(#leavesGradient1)"/>
  
  <!-- Middle layer of leaves -->
  <ellipse cx="400" cy="400" rx="240" ry="180" fill="url(#leavesGradient2)"/>
  
  <!-- Top layer of leaves -->
  <ellipse cx="400" cy="270" rx="180" ry="150" fill="url(#leavesGradient3)"/>
  
  <!-- Top crown -->
  <ellipse cx="400" cy="180" rx="120" ry="120" fill="url(#leavesGradient2)"/>
  
  <!-- Small leaves details for depth -->
  <circle cx="250" cy="500" r="60" fill="#4CAF50" opacity="0.8"/>
  <circle cx="550" cy="480" r="70" fill="#43A047" opacity="0.8"/>
  <circle cx="300" cy="350" r="50" fill="#66BB6A" opacity="0.7"/>
  <circle cx="500" cy="330" r="55" fill="#388E3C" opacity="0.8"/>
  <circle cx="350" cy="220" r="45" fill="#81C784" opacity="0.7"/>
  <circle cx="450" cy="210" r="50" fill="#4CAF50" opacity="0.7"/>
  
  <!-- Highlights for dimension -->
  <ellipse cx="380" cy="200" rx="40" ry="30" fill="#A5D6A7" opacity="0.5"/>
  <ellipse cx="420" cy="320" rx="60" ry="40" fill="#A5D6A7" opacity="0.4"/>
  <ellipse cx="390" cy="480" rx="80" ry="50" fill="#A5D6A7" opacity="0.3"/>
</svg>
